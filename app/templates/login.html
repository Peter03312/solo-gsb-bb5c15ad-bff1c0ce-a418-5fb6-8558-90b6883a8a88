{% extends "base.html" %}
{% block title %}登录 - 盲法编码管理系统{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:40px auto;">
  <h2>登录</h2>
  <form method="post">
    <label>用户名</label>
    <input type="text" name="username" required autofocus>
    <label>密码</label>
    <input type="password" name="password" required>
    <p><button class="btn" type="submit">登录</button></p>
  </form>
  <p class="muted">负责人（manager）可录入并生成编码；授权查看（viewer）可查看映射与揭盲快照。</p>
</div>
{% endblock %}
